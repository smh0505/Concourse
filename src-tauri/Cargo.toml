[package]
name = "concourse"
version = "2.4.0"
description = "Concourse - unified game library client"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "concourse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
discord-rich-presence = "1"
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
sysinfo = "0.32"
wasmtime = { version = "27", features = ["component-model"] }
wasmtime-wasi = "27"
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
bytes = "1"
sha2 = "0.10"
image = "0.25"
sigstore-verify = "0.1"
sigstore-trust-root = "0.1"
sigstore-bundle = "0.1"
sigstore-types = "0.1"
# For translation.rs - not an inference engine crate at all (see that module's own doc comment
# for why: llama.cpp's own prebuilt server binary is downloaded and run as a subprocess instead,
# talked to over HTTP, rather than linking any ML engine into this binary).
tokio = { version = "1", features = ["fs", "io-util", "sync", "process", "time"] }
# obs-websocket v5 client, for obs_websocket.rs's scene-switch-on-launch feature - not the same
# thing as obs_presence.rs's tiny_http overlay server, which stays a passive Browser Source page.
obws = "0.15"

[target.'cfg(windows)'.dependencies]
# For pseudo_fullscreen.rs's window styling/letterbox overlay - Milestone 39.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_LibraryLoader"] }
winreg = "0.52"

